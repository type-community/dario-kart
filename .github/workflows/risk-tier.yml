name: Risk tier

# Sets the PR's risk tier from the paths it changes and fails until it has enough
# human approvals on the current head commit. Make "Risk tier / approvals" a required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

concurrency:
  group: risk-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  approvals:
    name: approvals
    runs-on: ubuntu-latest
    steps:
      # Run the script from main so a PR can't loosen its own rules.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun scripts/review/risk-tier.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
