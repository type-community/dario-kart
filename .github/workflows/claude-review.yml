name: Claude review

# Layer 2 and 3: an AI bug review and a separate security review on every PR.
# Needs the ANTHROPIC_API_KEY repository secret. Secrets aren't passed to forks.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    name: Code review
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Count earlier review rounds
        id: rounds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            --jq '[.[] | select(.user.type == "Bot")] | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "before=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          claude_args: --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EARLIER REVIEW ROUNDS: ${{ steps.rounds.outputs.count }}
            PREVIOUS HEAD: ${{ steps.rounds.outputs.before }}

            Review this pull request. Read CLAUDE.md and REVIEW.md first and follow them.

            Read the diff against the whole repo and the PR description. Ask: does the change
            solve its stated problem, fit the system, or break something else? On a bug fix,
            look for the root cause.

            Before posting, verify each candidate finding yourself: re-read the code, trace the
            call path, and drop anything you can't back with a file and line. Drop findings that
            are only about style, diagnostics or cleanup.

            Post findings as inline comments, most severe first, each tagged **Important**, **Nit**
            (at most 3) or **Pre-existing** (bugs this PR didn't introduce). Then post one summary
            comment that starts with the count, or says "Nothing to fix." plainly.

            Convergence rules:
            - If EARLIER REVIEW ROUNDS >= 1 and PREVIOUS HEAD is set, review only `git diff PREVIOUS_HEAD...HEAD`.
            - Never repeat a finding already posted on this PR (check with `gh pr view --comments`).
            - If EARLIER REVIEW ROUNDS >= 3, don't post new nits. In the summary, ask the author
              to step back and reconsider the approach if Important findings keep appearing.

  security-review:
    name: Security review
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
